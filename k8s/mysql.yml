# MySQL 8.0 StatefulSet + Headless Service
# 密码引用 config.yml 中的 ruoyi-secret
# Init SQL 通过 mysql-initdb-wrapper + mysql-sql-files ConfigMap 挂载

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: newpm
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          args:
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_general_ci
            - --default-authentication-plugin=caching_sha2_password
          ports:
            - containerPort: 3306
          env:
            - name: TZ
              value: Asia/Shanghai
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ruoyi-secret
                  key: db-password
            - name: MYSQL_DATABASE
              value: "ry-vue"
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              # 2026-08-07：由 1Gi 提到 2Gi。1Gi 下实际占用已达 ~75%（753MB），
              # 突发查询（大结果集排序/临时表）一冲即被 OOMKilled，生产反复重启。
              # 运维当时是用 kubectl edit 在线改的，仓库未同步 —— 于是 last-applied
              # 注解仍停留在 1Gi，任何人执行 `kubectl apply -f k8s/` 都会把它改回 1Gi
              # 并触发重建，故障会在一次与 MySQL 无关的部署操作后突然复现。
              # 此处同步仓库即拆除该隐患（生产已是 2Gi，无需再 apply，零停机）。
              # 完整诊断见 docs/plans/2026-08-06-mysql-oom-fix.md
              memory: "2Gi"
              cpu: "500m"
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
            - name: initdb-wrapper
              mountPath: /docker-entrypoint-initdb.d/00-create-db.sql
              subPath: 00-create-db.sql
            - name: initdb-wrapper
              mountPath: /docker-entrypoint-initdb.d/01-import-sql.sh
              subPath: 01-import-sql.sh
            - name: sql-files
              mountPath: /sql-files
          livenessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "localhost"]
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "localhost"]
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: initdb-wrapper
          configMap:
            name: mysql-initdb-wrapper
            defaultMode: 0755
        - name: sql-files
          configMap:
            name: mysql-sql-files
  volumeClaimTemplates:
    - metadata:
        name: mysql-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: newpm
spec:
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306
  clusterIP: None
